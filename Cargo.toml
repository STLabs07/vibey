[package]
name = "vibey"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, read-only, VS Code-shaped window for coding through terminal AI CLIs"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
irosashi = "0.3"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
similar = "3.2.0"
toml = "1.1.8"
vte4 = { version = "0.10", features = ["v0_76"] }
