[package]
name = "vibey"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libc = "0.2.190"
serde_json = "1.0.152"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
vte4 = { version = "0.10", features = ["v0_76"] }
